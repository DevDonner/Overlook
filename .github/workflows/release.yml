name: Release

# A version tag (v1.0.0, v1.0.1-beta, ...) runs the tests and attaches the zip to a GitHub release.
# CurseForge builds and publishes its own copy from the same tag (its automatic packaging, set on the
# project), so this workflow deliberately has no CurseForge key: with one, every version would be
# uploaded twice.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - name: Tests
        run: lua tests/run.lua

      - uses: BigWigsMods/packager@v2
