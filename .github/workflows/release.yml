name: Release

# A version tag (v1.0.0, v1.0.1-beta, ...) runs the tests, then the BigWigs packager builds the zip,
# attaches it to a GitHub release and uploads it to CurseForge, WoWInterface and Wago.
# Each site is skipped until both its repo secret and its project ID in Overlook.toc are set
# (an ID of 0 means "not set"). Once CF_API_KEY is added, remove the CurseForge webhook on this
# repo, or every version reaches CurseForge twice. See docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - name: Tests
        run: lua tests/run.lua

      - uses: BigWigsMods/packager@v2
